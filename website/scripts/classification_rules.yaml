  - church of jesus christ
  - latter-day saints
  - lds

# Keywords matched against OWNER_NAME (case-insensitive, substring match)
religious_owner_keywords:
  - LAND RESERVE INC
  - PROPERTY RESERVE INC
  - SUBURBAN LAND RESERVE
  - CORP OF PRES BISHOP
  - CORP OF PRESIDING BISHOP
  - CHURCH OF JESUS CHRIST
